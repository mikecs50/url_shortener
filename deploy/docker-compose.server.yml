name: url-shortener
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: url_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d url_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    image: ghcr.io/mikecs50/url_shortener:latest
    ports:
     - "8080:8080"
    environment:
     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/url_db
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: